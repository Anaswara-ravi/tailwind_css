<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>CSS Grid</title>
</head>

<body class="bg-white p-5">

    <div class="grid grid-cols-4 grid-rows-[100px_100px_100px_80px] gap-2">

        <!-- HEADER -->
        <div class="col-span-4 bg-lime-400 border-2 border-black 
                    flex items-center justify-center font-bold text-xl">
            Header
        </div>

        <!-- SIDEBAR -->
        <div class="row-span-2 bg-lime-400 border-2 border-black 
                    flex items-center justify-center font-bold text-xl">
            Side Bar
        </div>

        <!-- CONTENT 1 -->
        <div class="col-span-3 bg-lime-400 border-2 border-black 
                    flex items-center justify-center font-bold text-xl">
            Content 1
        </div>

        <!-- CONTENT 2 -->
        <div class="col-span-1 bg-lime-400 border-2 border-black 
                    flex items-center justify-center font-bold text-xl">
            Content 2
        </div>

        <!-- CONTENT 3 -->
        <div class="col-span-2 bg-lime-400 border-2 border-black 
                    flex items-center justify-center font-bold text-xl">
            Content 3
        </div>

        <!-- FOOTER -->
        <div class="col-span-4 bg-lime-400 border-2 border-black 
                    flex items-center justify-center font-bold text-xl">
            Footer
        </div>

    </div>

</body>
</html>
